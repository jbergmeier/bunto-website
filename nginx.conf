server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Privacy promise: no access logs with visitor IPs written by this container
  access_log off;
  error_log /dev/stderr warn;

  # clean URLs: /impressum -> impressum.html, /en/privacy -> en/privacy.html
  location / { try_files $uri $uri.html $uri/ =404; }
  error_page 404 /404.html;

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'none'" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
}
